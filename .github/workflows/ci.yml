# CI of this monorepo: the shared monorepo CI (prestashopheaven/workflows, mono-ci.yml): composer check, the PHP syntax
# on every PHP version, the JavaScript tests of build-testing-js (npm test at the root) and the fixture module
# tests/fixture/heavenmonotesting, which runs the integration tests of build-testing-php in real shops (one job per
# PrestaShop version, never on the developer's PC).
name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  ci:
    uses: prestashopheaven/workflows/.github/workflows/mono-ci.yml@main
    with:
      shop-prestashop: '["8.1.0","8.1.7","8.2.8","9.0.3","9.1.5","9.2.0"]'
      fixture: tests/fixture/heavenmonotesting
      node: true
